<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Boletim do Aluno - SCOA</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
    >
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">SCOA</a>
    </div>
</nav>

<div class="container mt-4">

    <h2>Boletim do Aluno</h2>

    <div class="card shadow-sm my-3">
        <div class="card-body">
            <h4 class="card-title" th:text="${aluno.nome}">Nome do Aluno</h4>

            <p class="card-text mb-1">
                CPF:
                <span th:text="${aluno.cpf}">000.000.000-00</span>
            </p>

            <p class="card-text mb-1">
                E-mail:
                <span th:text="${aluno.email}">email@exemplo.com</span>
            </p>
        </div>
    </div>

    <h5 class="mt-4">Disciplinas / Turmas</h5>

    <table class="table table-striped table-hover shadow-sm">
        <thead class="table-dark">
        <tr>
            <th>Semestre</th>
            <th>Turma</th>
            <th>Disciplina</th>
            <th>Professor</th>
            <th>Nota</th>
            <th>Faltas</th>
            <th>Situação</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="m : ${matriculas}">
            <td th:text="${m.semestre}"></td>
            <td th:text="${m.turma != null ? m.turma.id : '---'}"></td>
            <td th:text="${m.turma != null && m.turma.disciplina != null ? m.turma.disciplina.nome : '---'}"></td>
            <td th:text="${m.turma != null && m.turma.professor != null ? m.turma.professor.nome : '---'}"></td>
            <td th:text="${m.nota != null ? m.nota : '-'}"></td>
            <td th:text="${m.faltas != null ? m.faltas : '-'}"></td>
            <td>
                <span th:if="${m.nota == null}"
                      class="badge bg-secondary">Em andamento</span>

                <span th:if="${m.nota != null and m.nota >= 6}"
                      class="badge bg-success">Aprovado</span>

                <span th:if="${m.nota != null and m.nota < 6}"
                      class="badge bg-danger">Reprovado</span>
            </td>
        </tr>
        </tbody>
    </table>

    <a th:href="@{/alunos}" class="btn btn-secondary mt-3">Voltar</a>

</div>

<footer class="mt-auto py-3 bg-dark text-light">
    <div class="container text-center">
        <small>SCOA © <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}"></span></small>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
