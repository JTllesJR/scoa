<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lançar Notas e Frequência - SCOA</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
    >
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">SCOA</a>
    </div>
</nav>

<div class="container mt-4">

    <h2 class="mb-3">
        Lançar Notas e Frequência
    </h2>

    <p class="text-muted">
        Turma <strong th:text="${turma.id}"></strong> —
        <span th:text="${turma.disciplina != null ? turma.disciplina.nome : 'Sem disciplina'}"></span> |
        Professor:
        <span th:text="${turma.professor != null ? turma.professor.nome : 'Sem professor'}"></span> |
        Semestre:
        <span th:text="${turma.semestre}"></span>
    </p>

    <!-- Mensagem de sucesso -->
    <div th:if="${mensagem}" class="alert alert-success" th:text="${mensagem}"></div>

    <form th:action="@{'/matriculas/turma/' + ${turma.id} + '/lancamentos'}" method="post">
        <table class="table table-striped table-hover shadow-sm">
            <thead class="table-dark">
            <tr>
                <th>Aluno</th>
                <th>Nota</th>
                <th>Faltas</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="m : ${matriculas}">
                <!-- id da matrícula (oculto, para saber qual atualizar) -->
                <input type="hidden" name="matriculaId" th:value="${m.id}"/>

                <td th:text="${m.aluno.nome}"></td>

                <td style="max-width: 120px;">
                    <input type="number" step="0.01" min="0" max="10"
                           class="form-control"
                           name="nota"
                           th:value="${m.nota}">
                </td>

                <td style="max-width: 120px;">
                    <input type="number" min="0"
                           class="form-control"
                           name="faltas"
                           th:value="${m.faltas}">
                </td>
            </tr>
            </tbody>
        </table>

        <div class="d-flex justify-content-between">
            <a th:href="@{/turmas}" class="btn btn-secondary">Voltar</a>
            <button type="submit" class="btn btn-primary">Salvar Lançamentos</button>
        </div>
    </form>

</div>

<footer class="mt-auto py-3 bg-dark text-light">
    <div class="container text-center">
        <small>SCOA © <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}"></span></small>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
