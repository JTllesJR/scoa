<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Alunos - SCOA</title>

    <!-- Bootstrap 5 -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
    >
</head>

<body class="bg-light">

<div class="container mt-5">

    <h1 class="mb-4 text-center">Lista de Alunos</h1>

    <div class="d-flex justify-content-between mb-3">
        <a href="/" class="btn btn-secondary">Voltar</a>
        <a href="/alunos/novo" class="btn btn-primary">Cadastrar novo aluno</a>
    </div>

    <table class="table table-striped table-hover shadow-sm">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>CPF</th>
            <th>Email</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="aluno : ${alunos}">
            <td th:text="${aluno.id}"></td>
            <td th:text="${aluno.nome}"></td>
            <td th:text="${aluno.cpf}"></td>
            <td th:text="${aluno.email}"></td>
        </tr>
        </tbody>
    </table>
</div>

<!-- Bootstrap JS (opcional, mas útil para componentes futuros) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
