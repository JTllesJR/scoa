<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Almoxarifado - Itens</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
    >
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">SCOA</a>
    </div>
</nav>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Itens do Almoxarifado</h2>
        <div>
            <a th:href="@{/almoxarifado/itens/novo}" class="btn btn-primary">Novo Item</a>
            <a th:href="@{/almoxarifado/movimentacoes}" class="btn btn-outline-dark ms-2">
                Histórico
            </a>
        </div>
    </div>

    <table class="table table-striped table-hover shadow-sm">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Código</th>
            <th>Quantidade</th>
            <th>Mínima</th>
            <th>Status</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="i : ${itens}">
            <td th:text="${i.id}"></td>
            <td th:text="${i.nome}"></td>
            <td th:text="${i.codigo}"></td>
            <td th:text="${i.quantidadeAtual}"></td>
            <td th:text="${i.quantidadeMinima}"></td>
            <td>
                <span th:if="${i.quantidadeAtual == null or i.quantidadeAtual == 0}"
                      class="badge bg-danger">Sem estoque</span>

                <span th:if="${i.quantidadeAtual != null and i.quantidadeMinima != null
                             and i.quantidadeAtual > 0
                             and i.quantidadeAtual <= i.quantidadeMinima}"
                      class="badge bg-warning text-dark">Estoque baixo</span>

                <span th:if="${i.quantidadeAtual != null and
                             (i.quantidadeMinima == null or i.quantidadeAtual > i.quantidadeMinima)}"
                      class="badge bg-success">OK</span>
            </td>
            <td>
                <div class="btn-group btn-group-sm" role="group">
                    <a th:href="@{'/almoxarifado/movimentar/' + ${i.id}}"
                       class="btn btn-outline-primary">
                        Movimentar
                    </a>
                </div>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="mt-3">
        <a th:href="@{/}" class="btn btn-secondary">Voltar</a>
    </div>

</div>

<footer class="mt-auto py-3 bg-dark text-light">
    <div class="container text-center">
        <small>SCOA © <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}"></span></small>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
