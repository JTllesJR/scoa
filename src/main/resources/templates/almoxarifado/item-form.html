<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Novo Item - Almoxarifado</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
    >
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">SCOA</a>
    </div>
</nav>

<div class="container mt-4">

    <h2 class="mb-3">Cadastro de Item</h2>

    <div class="alert alert-danger" th:if="${erro != null}" th:text="${erro}"></div>

    <div class="card shadow-sm mx-auto" style="max-width: 600px;">
        <div class="card-body">
            <form th:action="@{/almoxarifado/itens}" th:object="${item}" method="post">

                <div class="mb-3">
                    <label class="form-label">Nome</label>
                    <input type="text" class="form-control" th:field="*{nome}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Descrição</label>
                    <textarea class="form-control" th:field="*{descricao}" rows="2"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Código</label>
                    <input type="text" class="form-control" th:field="*{codigo}">
                    <div class="form-text">
                        Código interno do almoxarifado (opcional, mas se informado deve ser único).
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Quantidade inicial</label>
                    <input type="number" class="form-control" th:field="*{quantidadeAtual}" min="0">
                </div>

                <div class="mb-3">
                    <label class="form-label">Quantidade mínima</label>
                    <input type="number" class="form-control" th:field="*{quantidadeMinima}" min="0">
                    <div class="form-text">
                        Quando o estoque estiver abaixo ou igual a esse valor, será marcado como "Estoque baixo".
                    </div>
                </div>

                <div class="d-flex justify-content-between">
                    <a th:href="@{/almoxarifado}" class="btn btn-secondary">Voltar</a>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>

            </form>
        </div>
    </div>

</div>

<footer class="mt-auto py-3 bg-dark text-light">
    <div class="container text-center">
        <small>SCOA © <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}"></span></small>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
