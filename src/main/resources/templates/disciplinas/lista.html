<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Disciplinas - SCOA</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
    >
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">SCOA</a>
    </div>
</nav>

<div class="container mt-5">
    <h2 class="mb-4 text-center">Disciplinas</h2>

    <div class="d-flex justify-content-between mb-3">
        <a th:href="@{/}" class="btn btn-secondary">Voltar</a>
        <a th:href="@{/disciplinas/novo}" class="btn btn-primary">Cadastrar Disciplina</a>
    </div>

    <table class="table table-striped table-hover shadow-sm">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Curso</th>
            <th>Carga Horária</th>
            <th>Obrigatória</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="d : ${disciplinas}">
            <td th:text="${d.id}"></td>
            <td th:text="${d.nome}"></td>
            <td th:text="${d.curso != null ? d.curso.nome : '—'}"></td>
            <td th:text="${d.cargaHoraria}"></td>
            <td>
                <span th:text="${d.obrigatoria} ? 'Sim' : 'Não'"></span>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<footer class="mt-auto py-3 bg-dark text-light">
    <div class="container text-center">
        <small>SCOA © <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}"></span></small>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
