<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Disciplina - SCOA</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
    >
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">SCOA</a>
    </div>
</nav>

<div class="container mt-5">

    <h2 class="mb-4 text-center">Cadastrar Nova Disciplina</h2>

    <div class="card shadow-sm mx-auto" style="max-width: 700px;">
        <div class="card-body">

            <form th:action="@{/disciplinas}" th:object="${disciplina}" method="post">

                <div class="mb-3">
                    <label class="form-label">Nome da Disciplina</label>
                    <input type="text" th:field="*{nome}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Curso</label>
                    <select class="form-select" name="idCurso" required>
                        <option value="" disabled selected>Selecione um curso</option>
                        <option th:each="c : ${cursos}"
                                th:value="${c.id}"
                                th:text="${c.nome}">
                        </option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Carga Horária (horas)</label>
                    <input type="number" th:field="*{cargaHoraria}" class="form-control" min="0">
                </div>

                <div class="mb-3">
                    <label class="form-label">Obrigatória?</label>
                    <select th:field="*{obrigatoria}" class="form-select">
                        <option th:value="true">Sim</option>
                        <option th:value="false">Não</option>
                    </select>
                </div>

                <div class="d-flex justify-content-between">
                    <a th:href="@{/disciplinas}" class="btn btn-secondary">Voltar</a>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>

            </form>

        </div>
    </div>

</div>

<footer class="mt-auto py-3 bg-dark text-light">
    <div class="container text-center">
        <small>SCOA © <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}"></span></small>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
