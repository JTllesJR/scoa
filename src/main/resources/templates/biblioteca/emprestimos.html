<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${tituloPagina}">Empréstimos - SCOA</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
    >
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">SCOA</a>
    </div>
</nav>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h2 th:text="${tituloPagina}">Empréstimos</h2>
            <p class="text-muted mb-0" th:if="${aluno != null}">
                Aluno:
                <strong th:text="${aluno.nome}"></strong>
                (<span th:text="${aluno.cpf}"></span>)
            </p>
        </div>

        <a th:href="@{/obras}" class="btn btn-primary">
            Ver Acervo / Emprestar
        </a>
    </div>

    <table class="table table-striped table-hover shadow-sm">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Aluno</th>
            <th>Obra</th>
            <th>Cód. Acervo</th>
            <th>Empréstimo</th>
            <th>Prev. Devolução</th>
            <th>Devolução</th>
            <th>Status</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="e : ${emprestimos}">
            <td th:text="${e.id}"></td>
            <td th:text="${e.aluno != null ? e.aluno.nome : '---'}"></td>
            <td th:text="${e.obra != null ? e.obra.titulo : '---'}"></td>
            <td th:text="${e.obra != null ? e.obra.codigoAcervo : '---'}"></td>
            <td th:text="${e.dataEmprestimo}"></td>
            <td th:text="${e.dataPrevistaDevolucao != null ? e.dataPrevistaDevolucao : '-'}"></td>
            <td th:text="${e.dataDevolucao != null ? e.dataDevolucao : '-'}"></td>
            <td>
                <span th:if="${e.devolvido == true}"
                      class="badge bg-success">Devolvido</span>
                <span th:if="${e.devolvido == null || e.devolvido == false}"
                      class="badge bg-warning text-dark">Em aberto</span>
            </td>
            <td>
                <form th:if="${e.devolvido == null || e.devolvido == false}"
                      th:action="@{'/biblioteca/' + ${e.id} + '/devolver'}"
                      method="post" class="d-inline">
                    <input type="hidden" name="redirectAlunoId"
                           th:value="${aluno != null ? aluno.id : null}">
                    <button type="submit" class="btn btn-sm btn-outline-success">
                        Registrar devolução
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="mt-3">
        <a th:href="@{/}" class="btn btn-secondary">Voltar</a>
    </div>

</div>

<footer class="mt-auto py-3 bg-dark text-light">
    <div class="container text-center">
        <small>SCOA © <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}"></span></small>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
