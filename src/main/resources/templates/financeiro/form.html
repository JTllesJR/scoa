<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nova Mensalidade - SCOA</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
    >
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">SCOA</a>
    </div>
</nav>

<div class="container mt-4">

    <h2 class="mb-3">Nova Mensalidade</h2>

    <div class="card shadow-sm mx-auto" style="max-width: 600px;">
        <div class="card-body">

            <form th:action="@{/financeiro}" method="post">

                <!-- Aluno -->
                <div class="mb-3">
                    <label class="form-label">Aluno</label>
                    <select class="form-select" name="alunoId" required>
                        <option disabled selected value="">Selecione um aluno</option>
                        <option th:each="a : ${alunos}"
                                th:value="${a.id}"
                                th:text="${a.nome}">
                        </option>
                    </select>
                </div>

                <!-- Competência -->
                <div class="mb-3">
                    <label class="form-label">Competência</label>
                    <input type="text" name="competencia" class="form-control"
                           placeholder="2025-01" required>
                    <div class="form-text">
                        Use um formato simples, ex.: 2025-01, 2025-02 etc.
                    </div>
                </div>

                <!-- Valor -->
                <div class="mb-3">
                    <label class="form-label">Valor</label>
                    <input type="number" step="0.01" min="0" name="valor" class="form-control" required>
                </div>

                <!-- Data de vencimento -->
                <div class="mb-3">
                    <label class="form-label">Data de vencimento</label>
                    <input type="date" name="dataVencimento" class="form-control">
                </div>

                <div class="d-flex justify-content-between">
                    <a th:href="@{/financeiro}" class="btn btn-secondary">Voltar</a>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>

            </form>

        </div>
    </div>

</div>

<footer class="mt-auto py-3 bg-dark text-light">
    <div class="container text-center">
        <small>SCOA © <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}"></span></small>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
