<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${tituloPagina}">Mensalidades - SCOA</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
    >
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">SCOA</a>
    </div>
</nav>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h2 th:text="${tituloPagina}">Mensalidades</h2>
            <p class="text-muted mb-0" th:if="${aluno != null}">
                Aluno:
                <strong th:text="${aluno.nome}"></strong>
                (<span th:text="${aluno.cpf}"></span>)
            </p>
        </div>

        <a th:href="@{/financeiro/novo}" class="btn btn-primary">
            Nova Mensalidade
        </a>
    </div>

    <table class="table table-striped table-hover shadow-sm">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Aluno</th>
            <th>Competência</th>
            <th>Vencimento</th>
            <th>Valor</th>
            <th>Status</th>
            <th>Pagamento</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="m : ${mensalidades}">
            <td th:text="${m.id}"></td>
            <td th:text="${m.aluno != null ? m.aluno.nome : '---'}"></td>
            <td th:text="${m.competencia}"></td>
            <td th:text="${m.dataVencimento != null ? m.dataVencimento : '-'}"></td>
            <td th:text="${m.valor}"></td>
            <td>
                <span th:if="${m.pago == null || m.pago == false}"
                      class="badge bg-warning text-dark">Pendente</span>
                <span th:if="${m.pago == true}"
                      class="badge bg-success">Pago</span>
            </td>
            <td th:text="${m.dataPagamento != null ? m.dataPagamento : '-'}"></td>
            <td>
                <div class="btn-group btn-group-sm" role="group">
                    <!-- Marcar como paga -->
                    <form th:if="${m.pago == null || m.pago == false}"
                          th:action="@{'/financeiro/' + ${m.id} + '/pagar'}"
                          method="post" class="d-inline">
                        <input type="hidden" name="redirectAlunoId"
                               th:value="${aluno != null ? aluno.id : null}">
                        <button type="submit" class="btn btn-outline-success">
                            Marcar como paga
                        </button>
                    </form>
                </div>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="mt-3">
        <a th:href="@{/alunos}" class="btn btn-secondary">Voltar para Alunos</a>
    </div>

</div>

<footer class="mt-auto py-3 bg-dark text-light">
    <div class="container text-center">
        <small>SCOA © <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}"></span></small>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
