<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Turmas - SCOA</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
    >
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">SCOA</a>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Turmas</h2>
        <a th:href="@{/turmas/novo}" class="btn btn-primary">Nova Turma</a>
    </div>

    <table class="table table-striped table-hover shadow-sm">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Disciplina</th>
            <th>Professor</th>
            <th>Semestre</th>
            <th>Dia</th>
            <th>Horário</th>
            <th>Capacidade</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="t : ${turmas}">
            <td th:text="${t.id}"></td>
            <td th:text="${t.disciplina != null ? t.disciplina.nome : '---'}"></td>
            <td th:text="${t.professor != null ? t.professor.nome : '---'}"></td>
            <td th:text="${t.semestre}"></td>
            <td th:text="${t.diaSemana}"></td>
            <td th:text="${t.horaInicio + ' - ' + t.horaFim}"></td>
            <td th:text="${t.capacidade}"></td>
            <td>
                <div class="btn-group btn-group-sm" role="group">
                    <a th:href="@{'/turmas/editar/' + ${t.id}}" class="btn btn-outline-secondary">
                        Editar
                    </a>
                    <a th:href="@{'/matriculas/turma/' + ${t.id} + '/lancamentos'}"
                       class="btn btn-outline-primary">
                        Notas/Freq.
                    </a>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<footer class="mt-auto py-3 bg-dark text-light">
    <div class="container text-center">
        <small>SCOA © <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}"></span></small>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
