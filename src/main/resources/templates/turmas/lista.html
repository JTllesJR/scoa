<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Turmas - SCOA</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
    >
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">SCOA</a>
    </div>
</nav>

<div class="container mt-5">
    <h2 class="mb-4 text-center">Turmas</h2>

    <div class="d-flex justify-content-between mb-3">
        <a th:href="@{/}" class="btn btn-secondary">Voltar</a>
        <a th:href="@{/turmas/novo}" class="btn btn-primary">Cadastrar Turma</a>
    </div>

    <table class="table table-striped table-hover shadow-sm">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Disciplina</th>
            <th>Professor</th>
            <th>Semestre</th>
            <th>Dia da semana</th>
            <th>Horário</th>
            <th>Capacidade</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="t : ${turmas}">
            <td th:text="${t.id}"></td>
            <td th:text="${t.disciplina != null ? t.disciplina.nome : '—'}"></td>
            <td th:text="${t.professor != null ? t.professor.nome : '—'}"></td>
            <td th:text="${t.semestre}"></td>
            <td th:text="${t.diaSemana}"></td>
            <td>
                <span th:text="${t.horaInicio}"></span>
                <span> - </span>
                <span th:text="${t.horaFim}"></span>
            </td>
            <td th:text="${t.capacidade}"></td>
        </tr>
        </tbody>
    </table>
</div>

<footer class="mt-auto py-3 bg-dark text-light">
    <div class="container text-center">
        <small>SCOA © <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}"></span></small>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
