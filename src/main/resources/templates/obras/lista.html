<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Obras - SCOA</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
    >
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">SCOA</a>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Acervo da Biblioteca</h2>
        <a th:href="@{/obras/novo}" class="btn btn-primary">Nova Obra</a>
    </div>

    <table class="table table-striped table-hover shadow-sm">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Título</th>
            <th>Autor</th>
            <th>Código de Acervo</th>
            <th>Status</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="o : ${obras}">
            <td th:text="${o.id}"></td>
            <td th:text="${o.titulo}"></td>
            <td th:text="${o.autor}"></td>
            <td th:text="${o.codigoAcervo}"></td>
            <td>
                <span th:if="${o.disponivel == true}" class="badge bg-success">Disponível</span>
                <span th:if="${o.disponivel == null || o.disponivel == false}" class="badge bg-warning text-dark">Emprestada</span>
            </td>
            <td>
                <div class="btn-group btn-group-sm" role="group">
                    <!-- Emprestar somente se disponível -->
                    <a th:if="${o.disponivel == true}"
                       th:href="@{'/biblioteca/emprestar/' + ${o.id}}"
                       class="btn btn-outline-primary">
                        Emprestar
                    </a>
                </div>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="mt-3">
        <a th:href="@{/}" class="btn btn-secondary">Voltar</a>
        <a th:href="@{/biblioteca}" class="btn btn-outline-dark ms-2">Ver Empréstimos</a>
    </div>
</div>

<footer class="mt-auto py-3 bg-dark text-light">
    <div class="container text-center">
        <small>SCOA © <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}"></span></small>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
