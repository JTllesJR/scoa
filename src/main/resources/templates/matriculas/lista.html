<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Matrículas - SCOA</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">SCOA</a>
    </div>
</nav>

<div class="container mt-5">

    <h2 class="mb-4 text-center">Matrículas</h2>

    <div class="d-flex justify-content-between mb-3">
        <a th:href="@{/}" class="btn btn-secondary">Voltar</a>
        <a th:href="@{/matriculas/novo}" class="btn btn-primary">Nova Matrícula</a>
    </div>

    <table class="table table-striped table-hover shadow-sm">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Aluno</th>
            <th>Turma</th>
            <th>Disciplina</th>
            <th>Professor</th>
            <th>Semestre</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="m : ${matriculas}">
            <td th:text="${m.id}"></td>
            <td th:text="${m.aluno != null ? m.aluno.nome : '—'}"></td>
            <td th:text="${m.turma != null ? m.turma.id : '—'}"></td>
            <td th:text="${m.turma != null && m.turma.disciplina != null ? m.turma.disciplina.nome : '—'}"></td>
            <td th:text="${m.turma != null && m.turma.professor != null ? m.turma.professor.nome : '—'}"></td>
            <td th:text="${m.semestre}"></td>
        </tr>
        </tbody>
    </table>

</div>

<footer class="mt-auto py-3 bg-dark text-light text-center">
    <small>SCOA © <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}"></span></small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
