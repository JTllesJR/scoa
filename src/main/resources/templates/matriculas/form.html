<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nova Matrícula - SCOA</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">SCOA</a>
    </div>
</nav>

<div class="container mt-5">

    <h2 class="mb-4 text-center">Nova Matrícula</h2>

    <div class="card shadow-sm mx-auto" style="max-width: 700px;">
        <div class="card-body">

            <!-- ALERTA DE ERRO (MOSTRA QUANDO EXISTE A VARIÁVEL 'erro') -->
            <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

            <form th:action="@{/matriculas}" method="post">

                <!-- ALUNO -->
                <div class="mb-3">
                    <label class="form-label">Aluno</label>
                    <select class="form-select" name="alunoId" required>
                        <option disabled selected value="">Selecione um aluno</option>
                        <option th:each="a : ${alunos}"
                                th:value="${a.id}"
                                th:text="${a.nome}">
                        </option>
                    </select>
                </div>

                <!-- TURMA -->
                <div class="mb-3">
                    <label class="form-label">Turma</label>
                    <select class="form-select" name="turmaId" required>
                        <option disabled selected value="">Selecione uma turma</option>
                        <option th:each="t : ${turmas}"
                                th:value="${t.id}"
                                th:text="${t.disciplina != null ? t.disciplina.nome : 'Turma ' + t.id}">
                        </option>
                    </select>
                </div>

                <!-- SEMESTRE -->
                <div class="mb-3">
                    <label class="form-label">Semestre</label>
                    <input type="text" name="semestre" class="form-control" placeholder="2025.1" required>
                </div>

                <div class="d-flex justify-content-between">
                    <a th:href="@{/matriculas}" class="btn btn-secondary">Voltar</a>
                    <button type="submit" class="btn btn-primary">Matricular</button>
                </div>

            </form>

        </div>
    </div>

</div>

<footer class="mt-auto py-3 bg-dark text-light text-center">
    <small>SCOA © <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}"></span></small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
